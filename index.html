<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>GMU Asset Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0b0f14;color:#fff;overflow:hidden}
  .bar{background:#0F3D5C;padding:14px 18px;display:flex;align-items:center;gap:12px;position:relative;z-index:10}
  .bar h1{font-size:17px;font-weight:700;flex:1}
  .bar .badge{font-size:11px;color:#0E9594;font-weight:700;letter-spacing:.5px}
  #stage{position:relative;width:100%;height:calc(100vh - 56px);display:flex;flex-direction:column}
  #camBox{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
  video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
  canvas{display:none}
  .frame{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);width:min(66vw,250px);height:min(66vw,250px);border:3px solid #0E9594;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.5);pointer-events:none;transition:border-color .15s}
  .frame.hit{border-color:#22c55e;border-width:5px}
  .hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);font-size:13px;padding:7px 16px;border-radius:20px;max-width:92vw;text-align:center;z-index:3}
  .panel{background:#0b0f14;padding:16px 18px 22px;display:flex;flex-direction:column;gap:12px;z-index:5}
  .bigbtn{width:100%;background:#0E9594;color:#fff;border:none;padding:16px;border-radius:12px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 16px rgba(14,149,148,.4)}
  .bigbtn:active{transform:scale(.98)}
  .row{display:flex;gap:10px}
  .row .bigbtn{flex:1}
  .torch{flex:0 0 auto;width:58px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);font-size:20px;box-shadow:none}
  .manual{display:flex;gap:8px}
  .manual input{flex:1;font-size:16px;padding:13px 14px;border:none;border-radius:11px;background:#fff;color:#000}
  .manual button{background:#0F3D5C;color:#fff;border:none;padding:13px 18px;border-radius:11px;font-size:15px;font-weight:700;white-space:nowrap}
  .errline{color:#fca5a5;text-align:center;font-size:13px;line-height:1.4}
  .result{position:fixed;inset:0;background:#fff;color:#1B2733;z-index:100;overflow:auto;display:none}
  .rbar{background:#0F3D5C;color:#fff;padding:16px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0}
  .rbar h2{font-size:17px;flex:1}
  .rbar button{background:#0E9594;color:#fff;border:none;padding:9px 18px;border-radius:9px;font-size:14px;font-weight:700}
  .rbody{padding:20px}
  .card{background:#F4F6F9;border:2px solid #0E9594;border-radius:14px;padding:20px;margin-bottom:14px}
  .chip{display:inline-block;background:#e6eef2;border-radius:6px;padding:4px 11px;font-family:'Courier New',monospace;font-size:14px;margin:2px 4px 2px 0;color:#0F3D5C;font-weight:700}
  .kv div{padding:9px 0;border-bottom:1px solid #e3e8ee}
  .kv .k{color:#62707E;font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .kv .v{font-weight:600;color:#1B2733;margin-top:3px;font-size:15px}
  .st{display:inline-block;padding:5px 15px;border-radius:14px;color:#fff;font-size:13px;font-weight:700;margin-top:10px}
  .st-Available{background:#15803D}.st-Issued{background:#1565C0}.st-Returned{background:#0E9594}
  .st-Maintenance{background:#E65100}.st-Damaged{background:#B91C1C}.st-Lost{background:#7F1D1D}
  .st-Disposed{background:#3F3F46}.st-OnHold{background:#4B5563;border:2px solid #DC2626}
  .hold{background:rgba(220,38,38,.1);border:1px solid #DC2626;border-radius:10px;padding:12px;margin-top:12px;color:#991B1B;font-weight:600;font-size:14px}
  .notfound{background:rgba(220,38,38,.08);border:1px solid #DC2626;border-radius:12px;padding:22px;text-align:center}
  .notfound b{color:#B91C1C;font-size:18px}
  .loading{text-align:center;padding:40px;color:#62707E;font-size:15px}
</style>
</head>
<body>
  <div class="bar">
    <span style="font-size:20px">📷</span>
    <h1>GMU Asset Scanner</h1>
    <span class="badge">SCAN TO FIND</span>
  </div>

  <div id="stage">
    <div id="camBox">
      <video id="v" playsinline autoplay muted webkit-playsinline></video>
      <canvas id="c"></canvas>
      <div class="frame" id="frame"></div>
      <div class="hint" id="hint">Tap "Start Camera" below</div>
    </div>

    <div class="panel">
      <div id="errSlot"></div>
      <div class="row" id="camRow" style="display:none">
        <button class="bigbtn" id="scanBtn" onclick="doScan()">🔍 Scan Now</button>
        <button class="bigbtn torch" id="torchBtn" onclick="toggleTorch()" style="display:none">🔦</button>
      </div>
      <button class="bigbtn" id="startBtn" onclick="startCam()">📷 Start Camera</button>
      <div class="manual">
        <input id="manual" placeholder="Or type Tag / Serial number" autocomplete="off"
          onkeydown="if(event.key==='Enter')lookup(this.value)">
        <button onclick="lookup(document.getElementById('manual').value)">Find</button>
      </div>
    </div>
  </div>

  <div class="result" id="result">
    <div class="rbar"><h2 id="rtitle">Device Details</h2><button onclick="scanAgain()">✕ Close</button></div>
    <div class="rbody" id="rbody"></div>
  </div>

<script>
/* ============================================================
   CONFIG — your Apps Script /exec URL (same one the portal uses)
   ============================================================ */
var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwQO0nRwuqgQybbz1ReVEONu-pcsP_TTI4ZpFzzllLXEG3P29yq8XhzTzily-rw1GLc2w/exec';

var stream=null, loop=null, scanning=false, jsonpSeq=0, ctx=null, torchOn=false, videoReady=false;
var V, C;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function showErr(m){ $('errSlot').innerHTML='<div class="errline">'+esc(m)+'</div>'; }

window.addEventListener('load', function(){
  V=$('v'); C=$('c');
  setTimeout(startCam, 500);
});

function startCam(){
  $('errSlot').innerHTML='';
  $('hint').textContent='Requesting camera…';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    showErr('Camera not supported here. Use manual entry below.'); $('hint').textContent=''; return;
  }
  if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; }

  navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{ facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720} }
  }).then(function(s){
    stream=s;
    V.srcObject=s;
    V.setAttribute('playsinline',''); V.setAttribute('webkit-playsinline',''); V.muted=true;
    videoReady=false;

    V.onloadedmetadata=function(){
      V.play().then(afterPlay).catch(function(){ afterPlay(); });
    };
  }).catch(function(e){
    $('hint').textContent='';
    var msg = e.name==='NotAllowedError'
      ? "Camera permission denied. On iPhone: tap the 'aA' or camera icon in Safari's address bar, choose Website Settings, set Camera to Allow, then reload. Or use manual entry below."
      : (e.name==='NotFoundError' ? 'No camera found on this device. Use manual entry below.' : 'Camera error: '+e.message);
    showErr(msg);
  });
}

function afterPlay(){
  videoReady=true;
  $('startBtn').style.display='none';
  $('camRow').style.display='flex';
  $('hint').textContent='Fill the frame with the QR label, then tap "Scan Now"';
  try{ var cap=stream.getVideoTracks()[0].getCapabilities?stream.getVideoTracks()[0].getCapabilities():{}; if(cap.torch)$('torchBtn').style.display=''; }catch(e){}
  try{ stream.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(function(){}); }catch(e){}
  startLoop();
}

function startLoop(){
  scanning=true;
  if(loop) clearInterval(loop);
  loop=setInterval(function(){ if(scanning) scanFrame(); }, 300);
}

/* explicit Scan Now button */
function doScan(){
  if(!videoReady||!V.videoWidth){ showErr('Camera still starting — wait a second, then tap Scan Now.'); return; }
  $('hint').textContent='Scanning…';
  var found=scanFrame();
  if(!found){ setTimeout(function(){ if(scanning) $('hint').textContent='No code read — move closer, hold steady, tap Scan Now again'; },350); }
}

function scanFrame(){
  if(!V||!V.videoWidth){ return false; }
  var vw=V.videoWidth, vh=V.videoHeight;
  if(!ctx){ ctx=C.getContext('2d',{willReadFrequently:true}); }

  C.width=vw; C.height=vh;
  ctx.drawImage(V,0,0,vw,vh);
  var d=ctx.getImageData(0,0,vw,vh);
  var code=jsQR(d.data,vw,vh,{inversionAttempts:'attemptBoth'});

  if(!code){
    var cw=Math.floor(vw*0.55), ch=Math.floor(vh*0.55);
    var sx=Math.floor((vw-cw)/2), sy=Math.floor((vh-ch)/2);
    ctx.drawImage(V,sx,sy,cw,ch,0,0,vw,vh);
    var d2=ctx.getImageData(0,0,vw,vh);
    code=jsQR(d2.data,vw,vh,{inversionAttempts:'attemptBoth'});
  }

  if(code&&code.data){
    $('frame').classList.add('hit');
    stopCam();
    setTimeout(function(){ lookup(code.data); },150);
    return true;
  }
  return false;
}

function toggleTorch(){
  if(!stream)return;
  var tk=stream.getVideoTracks()[0];
  torchOn=!torchOn;
  tk.applyConstraints({advanced:[{torch:torchOn}]})
    .then(function(){ $('torchBtn').style.background=torchOn?'#F2A33C':'rgba(255,255,255,.12)'; })
    .catch(function(){ torchOn=false; });
}

function stopCam(){
  scanning=false; torchOn=false; videoReady=false;
  if(loop){ clearInterval(loop); loop=null; }
  if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; }
  var tb=$('torchBtn'); if(tb){ tb.style.display='none'; tb.style.background='rgba(255,255,255,.12)'; }
}

/* JSONP lookup — cross-origin safe */
function lookup(query){
  query=(query||'').trim();
  if(!query){ $('hint').textContent='Enter a tag or serial number'; return; }
  var result=$('result'), rbody=$('rbody');
  result.style.display='block';
  rbody.innerHTML='<div class="loading">🔍 Searching for '+esc(query)+'…</div>';

  var cb='gmucb_'+(++jsonpSeq)+'_'+Date.now();
  var timer=setTimeout(function(){ cleanup(); rbody.innerHTML='<div class="notfound"><b>Connection timeout</b><br><br><span style="color:#62707E">Could not reach the inventory backend. Check internet and the deployment URL.</span></div>'; },15000);
  window[cb]=function(data){ clearTimeout(timer); cleanup(); showResult(data,query); };
  function cleanup(){ try{delete window[cb];}catch(e){window[cb]=undefined;} var sc=$(cb); if(sc)sc.remove(); }

  var s=document.createElement('script');
  s.id=cb;
  s.src=EXEC_URL+(EXEC_URL.indexOf('?')>=0?'&':'?')+'action=find&callback='+cb+'&q='+encodeURIComponent(query);
  s.onerror=function(){ clearTimeout(timer); cleanup(); rbody.innerHTML='<div class="notfound"><b>Cannot reach backend</b><br><br><span style="color:#62707E">Verify the deployment URL is correct and set to "Anyone" access.</span></div>'; };
  document.body.appendChild(s);
}

function showResult(r,query){
  var rbody=$('rbody'); $('rtitle').textContent='Scan Result';
  if(!r||!r.ok||!r.matches||!r.matches.length){
    rbody.innerHTML='<div class="notfound"><b>No device found</b><br><br><span style="color:#62707E">Searched for:</span><br><span class="chip">'+esc(query)+'</span><br><br><span style="color:#62707E;font-size:14px">This tag/serial is not in the inventory.</span></div>';
    return;
  }
  rbody.innerHTML=r.matches.map(function(a){
    var stCls=a.status==='On Hold'?'st-OnHold':'st-'+String(a.status||'').replace(/\s/g,'');
    var hold=a.status==='On Hold'?'<div class="hold">🚫 ON HOLD: '+esc(a.holdComment||'no reason given')+'</div>':'';
    var icon={Laptop:'💻',Desktop:'🖥️',iPad:'📱',iPhone:'📱',Monitor:'🖵','Network Device':'🌐',Printer:'🖨️',Accessory:'🔌'}[a.category]||'📦';
    return '<div class="card">'
      +'<div style="font-size:15px;color:#0F3D5C;font-weight:800;margin-bottom:4px">'+icon+' '+esc(a.category||'Asset')+'</div>'
      +'<div>'+(a.tag?'<span class="chip">'+esc(a.tag)+'</span>':'')+(a.sn?'<span class="chip">'+esc(a.sn)+'</span>':'')+'</div>'
      +'<span class="st '+stCls+'">'+esc(a.status==='On Hold'?'🚫 On Hold':(a.status||'—'))+'</span>'+hold
      +'<div class="kv" style="margin-top:14px">'
      +kv('Tag Number',a.tag)
      +kv('Serial Number',a.sn)
      +kv('Brand / Model',((a.brand||'')+' '+(a.model||'')).trim())
      +kv('Current Custodian',a.custodian||'Unassigned')
      +kv('EMP ID',a.empId)
      +kv('College / Department',a.dept)
      +kv('Date of Issue',a.issuedDate)
      +kv('Next Issue Date',a.nextIssuedDate)
      +kv('Previous Custodian',a.prevCustodian)
      +kv('Returned Date',a.returnedDate)
      +kv('Procured Date',a.procuredDate)
      +kv('Warranty End',a.warrantyEnd)
      +kv('Comments',a.comments)
      +'</div>'
      +'</div>';
  }).join('')
  + '<button class="bigbtn" style="margin-top:4px" onclick="scanAgain()">✕ Close &amp; Scan Another</button>';
}
function kv(k,v){ if(!v||String(v).trim()==='')return''; return '<div><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>'; }

function scanAgain(){
  $('result').style.display='none';
  $('frame').classList.remove('hit');
  $('manual').value='';
  $('errSlot').innerHTML='';
  $('camRow').style.display='none';
  $('startBtn').style.display='';
  $('hint').textContent='Tap "Start Camera" below';
  startCam();
}
</script>
</body>
</html>
