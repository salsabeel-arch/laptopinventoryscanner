<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>GMU Asset Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0b0f14;color:#fff;overflow:hidden}
  .bar{background:#0F3D5C;padding:14px 18px;display:flex;align-items:center;gap:12px;position:relative;z-index:10}
  .bar h1{font-size:17px;font-weight:700;flex:1}
  .bar .badge{font-size:11px;color:#0E9594;font-weight:700;letter-spacing:.5px}
  #camWrap{position:relative;width:100%;height:calc(100vh - 56px);background:#000;overflow:hidden}
  video{width:100%;height:100%;object-fit:cover;display:block}
  canvas{display:none}
  .frame{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);width:min(70vw,260px);height:min(70vw,260px);border:3px solid #0E9594;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);pointer-events:none;transition:border-color .2s}
  .frame.hit{border-color:#22c55e}
  .hint{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);font-size:14px;padding:8px 20px;border-radius:24px;max-width:92vw;text-align:center}
  .controls{position:absolute;bottom:26px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 20px;z-index:5}
  .manual{display:flex;gap:8px;width:100%;max-width:440px}
  .manual input{flex:1;font-size:16px;padding:13px 14px;border:none;border-radius:11px;background:rgba(255,255,255,.96);color:#000}
  .manual button{background:#0E9594;color:#fff;border:none;padding:13px 20px;border-radius:11px;font-size:15px;font-weight:700;white-space:nowrap}
  .startBtn{background:#0E9594;color:#fff;border:none;padding:15px 30px;border-radius:12px;font-size:16px;font-weight:700;box-shadow:0 4px 18px rgba(14,149,148,.45)}
  .errline{color:#fca5a5;text-align:center;font-size:14px;max-width:92vw;line-height:1.4}
  .result{position:fixed;inset:0;background:#fff;color:#1B2733;z-index:100;overflow:auto;display:none}
  .rbar{background:#0F3D5C;color:#fff;padding:16px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0}
  .rbar h2{font-size:17px;flex:1}
  .rbar button{background:#0E9594;color:#fff;border:none;padding:9px 18px;border-radius:9px;font-size:14px;font-weight:700}
  .rbody{padding:20px}
  .card{background:#F4F6F9;border:2px solid #0E9594;border-radius:14px;padding:20px;margin-bottom:14px}
  .chip{display:inline-block;background:#e6eef2;border-radius:6px;padding:4px 11px;font-family:'Courier New',monospace;font-size:14px;margin:2px 4px 2px 0;color:#0F3D5C;font-weight:700}
  .kv div{padding:9px 0;border-bottom:1px solid #e3e8ee}
  .kv .k{color:#62707E;font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .kv .v{font-weight:600;color:#1B2733;margin-top:3px;font-size:15px}
  .st{display:inline-block;padding:5px 15px;border-radius:14px;color:#fff;font-size:13px;font-weight:700;margin-top:10px}
  .st-Available{background:#15803D}.st-Issued{background:#1565C0}.st-Returned{background:#0E9594}
  .st-Maintenance{background:#E65100}.st-Damaged{background:#B91C1C}.st-Lost{background:#7F1D1D}
  .st-Disposed{background:#3F3F46}.st-OnHold{background:#4B5563;border:2px solid #DC2626}
  .hold{background:rgba(220,38,38,.1);border:1px solid #DC2626;border-radius:10px;padding:12px;margin-top:12px;color:#991B1B;font-weight:600;font-size:14px}
  .notfound{background:rgba(220,38,38,.08);border:1px solid #DC2626;border-radius:12px;padding:22px;text-align:center}
  .notfound b{color:#B91C1C;font-size:18px}
  .loading{text-align:center;padding:40px;color:#62707E;font-size:15px}
</style>
</head>
<body>
  <div class="bar">
    <span style="font-size:20px">📷</span>
    <h1>GMU Asset Scanner</h1>
    <span class="badge">SCAN TO FIND</span>
  </div>

  <div id="camWrap">
    <video id="v" playsinline autoplay muted="true" webkit-playsinline="true"></video>
    <canvas id="c"></canvas>
    <div class="frame" id="frame"></div>
    <div class="hint" id="hint">Tap "Start Camera" to begin</div>
    <div class="controls" id="controls">
      <div id="errSlot"></div>
      <div class="manual">
        <input id="manual" placeholder="Or type Tag / Serial number" autocomplete="off"
          onkeydown="if(event.key==='Enter')lookup(this.value)">
        <button onclick="lookup(document.getElementById('manual').value)">🔍 Find</button>
      </div>
      <button class="startBtn" id="startBtn" onclick="startCam()">📷 Start Camera</button>
    </div>
  </div>

  <div class="result" id="result">
    <div class="rbar"><h2 id="rtitle">Result</h2><button onclick="scanAgain()">↺ Scan again</button></div>
    <div class="rbody" id="rbody"></div>
  </div>

<script>
/* ============================================================
   CONFIG — paste your Apps Script /exec URL here (the same one
   your portal uses). Nothing else needs changing.
   ============================================================ */
var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwQO0nRwuqgQybbz1ReVEONu-pcsP_TTI4ZpFzzllLXEG3P29yq8XhzTzily-rw1GLc2w/exec';

var stream=null, raf=null, scanning=false, jsonpSeq=0;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c];});}

function startCam(){
  var hint=document.getElementById('hint'), btn=document.getElementById('startBtn');
  document.getElementById('errSlot').innerHTML='';
  hint.textContent='Requesting camera…';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    showErr('Camera not supported on this browser. Use manual entry.'); hint.textContent=''; return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}})
    .then(function(s){
      stream=s;
      var v=document.getElementById('v');
      v.srcObject=s; v.setAttribute('playsinline',''); v.muted=true;
      v.play().catch(function(){});
      btn.style.display='none';
      hint.textContent='Point camera at a GMU QR label';
      scanning=true; raf=requestAnimationFrame(tick);
    })
    .catch(function(e){
      hint.textContent='';
      var msg = e.name==='NotAllowedError'
        ? 'Camera permission denied. On iPhone: tap "aA" in the address bar → Website Settings → Camera → Allow, then reload. Or use manual entry below.'
        : (e.name==='NotFoundError' ? 'No camera found on this device. Use manual entry.' : 'Camera error: '+e.message);
      showErr(msg);
    });
}
function showErr(msg){ document.getElementById('errSlot').innerHTML='<div class="errline">'+esc(msg)+'</div>'; }

function tick(){
  if(!scanning)return;
  var v=document.getElementById('v');
  if(!v||v.readyState<2){raf=requestAnimationFrame(tick);return;}
  var c=document.getElementById('c');
  c.width=v.videoWidth; c.height=v.videoHeight;
  var ctx=c.getContext('2d'); ctx.drawImage(v,0,0,c.width,c.height);
  var img=ctx.getImageData(0,0,c.width,c.height);
  var code=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
  if(code&&code.data){ document.getElementById('frame').classList.add('hit'); stopCam(); lookup(code.data); return; }
  raf=requestAnimationFrame(tick);
}
function stopCam(){
  scanning=false;
  if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}
  if(raf){cancelAnimationFrame(raf);raf=null;}
}

/* JSONP call — bypasses CORS entirely, works from GitHub Pages to Apps Script */
function lookup(query){
  query=(query||'').trim();
  if(!query){document.getElementById('hint').textContent='Enter a tag or serial number';return;}
  var result=document.getElementById('result'), rbody=document.getElementById('rbody');
  result.style.display='block';
  rbody.innerHTML='<div class="loading">🔍 Searching for '+esc(query)+'…</div>';

  var cb='gmucb_'+(++jsonpSeq)+'_'+Date.now();
  var timer=setTimeout(function(){
    cleanup();
    rbody.innerHTML='<div class="notfound"><b>Connection timeout</b><br><br><span style="color:#62707E">Could not reach the inventory backend. Check your internet and the deployment URL, then try again.</span></div>';
  }, 15000);

  window[cb]=function(data){ clearTimeout(timer); cleanup(); showResult(data, query); };
  function cleanup(){ try{delete window[cb];}catch(e){window[cb]=undefined;} var sc=document.getElementById(cb); if(sc)sc.remove(); }

  var s=document.createElement('script');
  s.id=cb;
  s.src=EXEC_URL + (EXEC_URL.indexOf('?')>=0?'&':'?') + 'action=find&callback=' + cb + '&q=' + encodeURIComponent(query);
  s.onerror=function(){ clearTimeout(timer); cleanup();
    rbody.innerHTML='<div class="notfound"><b>Cannot reach backend</b><br><br><span style="color:#62707E">Verify the deployment URL is correct and set to "Anyone" access.</span></div>'; };
  document.body.appendChild(s);
}

function showResult(r, query){
  var rbody=document.getElementById('rbody');
  document.getElementById('rtitle').textContent='Scan Result';
  if(!r||!r.ok||!r.matches||!r.matches.length){
    rbody.innerHTML='<div class="notfound"><b>No device found</b><br><br>'
      +'<span style="color:#62707E">Searched for:</span><br><span class="chip">'+esc(query)+'</span><br><br>'
      +'<span style="color:#62707E;font-size:14px">This tag/serial is not in the inventory. Check the code and try again.</span></div>';
    return;
  }
  rbody.innerHTML=r.matches.map(function(a){
    var stCls=a.status==='On Hold'?'st-OnHold':'st-'+String(a.status||'').replace(/\s/g,'');
    var hold=a.status==='On Hold'?'<div class="hold">🚫 ON HOLD: '+esc(a.holdComment||'no reason given')+'</div>':'';
    return '<div class="card">'
      +'<div>'+(a.sn?'<span class="chip">'+esc(a.sn)+'</span>':'')+(a.tag?'<span class="chip">'+esc(a.tag)+'</span>':'')+'</div>'
      +'<span class="st '+stCls+'">'+esc(a.status==='On Hold'?'🚫 On Hold':(a.status||'—'))+'</span>'
      +hold
      +'<div class="kv" style="margin-top:14px">'
      +kv('Category',a.category)+kv('Brand / Model',((a.brand||'')+' '+(a.model||'')).trim())
      +kv('Current Custodian',a.custodian||'Unassigned')+kv('EMP ID',a.empId)
      +kv('Department',a.dept)+kv('Date of Issue',a.issuedDate)
      +kv('Procured Date',a.procuredDate)+kv('Comments',a.comments)
      +'</div></div>';
  }).join('');
}
function kv(k,v){ if(!v||String(v).trim()==='')return''; return '<div><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>'; }

function scanAgain(){
  document.getElementById('result').style.display='none';
  document.getElementById('frame').classList.remove('hit');
  document.getElementById('manual').value='';
  document.getElementById('startBtn').style.display='';
  document.getElementById('errSlot').innerHTML='';
  document.getElementById('hint').textContent='Tap "Start Camera" to begin';
}

window.addEventListener('load', function(){ setTimeout(startCam, 400); });
</script>
</body>
</html>
